<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>범초냉장고</title>

    <!-- PWA 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="범초냉장고">
    <meta name="theme-color" content="#10B981">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --primary-color: #10B981;
            --primary-dark: #059669;
            --secondary-color: #3B82F6;
            --danger-color: #EF4444;
            --warning-color: #F59E0B;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 15px;
            padding-bottom: 90px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { margin-bottom: 20px; }
        h1 { font-size: 1.75rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 15px; text-align: center; letter-spacing: -0.5px; }

        .summary-widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .widget { background: var(--card-bg); padding: 12px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; border-top: 4px solid var(--primary-color); }
        .widget.warning { border-top-color: var(--danger-color); }
        .widget-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
        .widget-value { font-size: 1.25rem; font-weight: 700; }

        #recipe-section { margin-bottom: 25px; display: none; }
        .recipe-title { font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
        .recipe-container { display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 10px 0; scrollbar-width: none; }
        .recipe-container::-webkit-scrollbar { display: none; }
        .recipe-card { min-width: 200px; background: white; padding: 15px; border-radius: 15px; box-shadow: var(--shadow); border-left: 4px solid var(--secondary-color); cursor: pointer; transition: transform 0.1s; }
        .recipe-card:active { transform: scale(0.97); }
        .recipe-card h4 { font-size: 0.9rem; margin-bottom: 5px; color: var(--secondary-color); }
        .recipe-card p { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
        .recipe-card .youtube-tag { font-size: 0.7rem; color: #EF4444; font-weight: bold; }

        .list-controls { margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .search-box input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; outline: none; }
        .filter-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .tab-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); font-size: 0.8125rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* 목록형 리스트 */
        .inventory-grid { display: flex; flex-direction: column; gap: 0; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }

        .food-card { background: var(--card-bg); padding: 11px 14px; border: none; border-bottom: 1px solid #F3F4F6; display: flex; align-items: center; gap: 10px; }
        .food-card:last-child { border-bottom: none; }
        .food-card.expiring-soon { background-color: #FFF5F5; }

        /* 왼쪽 D-Day 뱃지 */
        .dday-badge { min-width: 38px; text-align: center; font-size: 0.65rem; font-weight: 700; padding: 3px 4px; border-radius: 7px; background: #F3F4F6; color: var(--text-muted); line-height: 1.3; }
        .dday-badge.urgent { background: #FEE2E2; color: var(--danger-color); }

        /* 중앙 정보 */
        .food-main { flex: 1; min-width: 0; }
        .food-name { font-weight: 700; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .food-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 1px; }

        /* 오른쪽 수량 + 액션 */
        .food-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .quantity-control { display: flex; align-items: center; gap: 5px; }
        .q-btn { width: 22px; height: 22px; border-radius: 50%; border: none; background: #F3F4F6; cursor: pointer; font-weight: bold; font-size: 0.8rem; line-height: 1; }
        .qty-num { font-size: 0.85rem; font-weight: 700; min-width: 16px; text-align: center; }
        .food-actions { display: flex; gap: 4px; }
        .action-btn { padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.68rem; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
        .edit-btn { border: 1px solid var(--primary-color); color: var(--primary-color); background: white; }
        .delete-btn { border: 1px solid var(--danger-color); color: var(--danger-color); background: white; }
        .save-btn { background: var(--primary-color); color: white; border: none; }
        .cancel-btn { background: var(--text-muted); color: white; border: none; }

        /* 인라인 수정 폼 (목록형) */
        .inline-edit-form { width: 100%; }
        .inline-edit-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .inline-edit-form input, .inline-edit-form select { padding: 6px 8px; font-size: 0.8rem; border-radius: 7px; border: 1px solid #E5E7EB; width: 100%; }
        .card-actions { display: flex; gap: 5px; margin-top: 4px; }
        .card-actions .action-btn { flex: 1; padding: 6px; font-size: 0.75rem; text-align: center; }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--primary-color); color: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; box-shadow: 0 8px 16px rgba(16,185,129,0.3); z-index: 900; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { font-size: 28px; cursor: pointer; color: #D1D5DB; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #4B5563; }
        input, select { width: 100%; padding: 12px; border: 1px solid #E5E7EB; border-radius: 12px; outline: none; font-size: 1rem; }
        .input-group-row { display: flex; gap: 8px; }
        .scan-btn { background: #F3F4F6; border: none; border-radius: 12px; padding: 0 15px; cursor: pointer; font-size: 1.2rem; }
        .submit-btn { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .inline-edit-form label { font-size: 0.75rem; margin-bottom: 3px; }
        .inline-edit-form input, .inline-edit-form select { padding: 8px; font-size: 0.85rem; margin-bottom: 8px; border-radius: 8px; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 15px; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧊 범초냉장고</h1>
        <div class="summary-widgets">
            <div class="widget">
                <div class="widget-label">전체 재고</div>
                <div id="total-count" class="widget-value">0</div>
            </div>
            <div class="widget warning">
                <div class="widget-label">유통기한 임박</div>
                <div id="near-expiry-count" class="widget-value">0</div>
            </div>
        </div>
    </header>

    <section id="recipe-section">
        <div class="recipe-title">👨‍🍳 남은 재료 활용 레시피</div>
        <div id="recipe-list" class="recipe-container"></div>
    </section>

    <div class="list-controls">
        <div class="search-box"><input type="text" id="search-input" placeholder="어떤 재료가 궁금하세요?"></div>
        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">전체</button>
            <button class="tab-btn" data-filter="냉장">냉장</button>
            <button class="tab-btn" data-filter="냉동">냉동</button>
            <button class="tab-btn" data-filter="실온">실온</button>
        </div>
    </div>

    <div id="inventory-list" class="inventory-grid"></div>
</div>

<div class="fab" id="open-reg-modal">＋</div>

<div id="reg-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🛒 식품 등록</h3>
            <span class="close-modal" id="close-reg-modal">&times;</span>
        </div>
        <form id="add-food-form">
            <div class="form-group">
                <label>식품명</label>
                <div class="input-group-row">
                    <input type="text" id="food-name" placeholder="무엇을 넣으실 건가요?" required>
                    <button type="button" id="scan-btn" class="scan-btn">📷</button>
                </div>
            </div>
            <div class="form-group">
                <label>카테고리</label>
                <select id="food-category">
                    <option>채소/과일</option><option>육류/해산물</option><option>유제품</option><option>가공식품</option><option>음료</option><option>기타</option>
                </select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label>수량</label>
                    <input type="number" id="food-quantity" value="1" min="1" required>
                </div>
                <div class="form-group">
                    <label>보관 장소</label>
                    <select id="storage-type">
                        <option>냉장</option><option>냉동</option><option>실온</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>유통기한</label>
                <input type="date" id="expiry-date" required>
            </div>
            <button type="submit" class="submit-btn">등록하기</button>
        </form>
    </div>
</div>

<div id="scanner-modal" class="modal">
    <div class="modal-content">
        <div id="reader"></div>
        <button id="close-scanner" class="action-btn cancel-btn" style="width: 100%;">취소</button>
    </div>
</div>

<!-- Firebase Realtime Database SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    // ============================================================
    // Firebase 설정 (beomcho-refrigerator 프로젝트)
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSy8bIQn9uCY7hfwVnQqFzwgQGv0kCBqjF6Y",
        authDomain: "beomcho-refrigerator.firebaseapp.com",
        databaseURL: "https://beomcho-refrigerator-default-rtdb.firebaseio.com",
        projectId: "beomcho-refrigerator",
        storageBucket: "beomcho-refrigerator.firebasestorage.app",
        messagingSenderId: "1097590814817",
        appId: "1:1097590814817:web:c63056f2d11ad542101220",
        measurementId: "G-HEHTBCDQT3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const inventoryRef = db.ref('inventory');

    // ============================================================
    // 앱 상태
    // ============================================================
    let inventory = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let editingId = null;

    const inventoryList = document.getElementById('inventory-list');
    const recipeSection = document.getElementById('recipe-section');
    const recipeList = document.getElementById('recipe-list');
    const regModal = document.getElementById('reg-modal');

    const RECIPE_DATA = {
        '채소/과일': [
            { title: '야채 볶음밥', desc: '자투리 채소를 잘게 썰어 볶아주세요.' },
            { title: '과일 스무디', desc: '과일과 우유를 믹서기에 갈아보세요.' }
        ],
        '육류/해산물': [
            { title: '제육볶음', desc: '고추장 양념과 함께 볶아보세요.' },
            { title: '해산물 라면', desc: '해물을 넣어 국물을 시원하게!' }
        ],
        '유제품': [
            { title: '우유 카레', desc: '물 대신 우유를 넣으면 고소해요.' },
            { title: '프렌치 토스트', desc: '식빵을 우유와 달걀물에 적셔 구우세요.' }
        ],
        '가공식품': [
            { title: '부대찌개', desc: '햄과 소시지를 듬뿍 넣어 끓여보세요.' },
            { title: '참치 비빔밥', desc: '참치캔과 야채를 넣어 간편하게.' }
        ]
    };

    // ============================================================
    // Firebase 실시간 리스너
    // ============================================================
    inventoryRef.orderByChild('expiryDate').on('value', (snapshot) => {
        inventory = [];
        snapshot.forEach((child) => {
            inventory.push({ id: child.key, ...child.val() });
        });
        renderInventory();
        updateSummary();
    });

    document.getElementById('expiry-date').valueAsDate = new Date();

    // ============================================================
    // 유틸 함수
    // ============================================================
    function calculateDDay(dateStr) {
        const today = new Date(); today.setHours(0,0,0,0);
        const target = new Date(dateStr); target.setHours(0,0,0,0);
        return Math.ceil((target - today) / 86400000);
    }

    function updateSummary() {
        document.getElementById('total-count').textContent = inventory.length;
        const nearExpiry = inventory.filter(i => calculateDDay(i.expiryDate) <= 3);
        document.getElementById('near-expiry-count').textContent = nearExpiry.length;
        updateRecipes(nearExpiry);
    }

    function updateRecipes(nearExpiryItems) {
        if (nearExpiryItems.length === 0) { recipeSection.style.display = 'none'; return; }
        recipeSection.style.display = 'block';
        recipeList.innerHTML = '';
        const categories = [...new Set(nearExpiryItems.map(i => i.category))];
        let recipesToShow = [];
        categories.forEach(cat => { if (RECIPE_DATA[cat]) recipesToShow = [...recipesToShow, ...RECIPE_DATA[cat]]; });
        if (recipesToShow.length === 0) recipesToShow.push({ title: '오늘의 요리', desc: '임박한 재료로 맛있는 요리를 만들어보세요!' });
        recipesToShow.forEach(r => {
            const div = document.createElement('div');
            div.className = 'recipe-card';
            div.onclick = () => window.open(`https://www.youtube.com/results?search_query=${r.title}+레시피`, '_blank');
            div.innerHTML = `<h4>${r.title}</h4><p>${r.desc}</p><span class="youtube-tag">▶ 유튜브에서 보기</span>`;
            recipeList.appendChild(div);
        });
    }

    function renderInventory() {
        inventoryList.innerHTML = '';
        const filtered = inventory.filter(i => {
            const fMatch = currentFilter === 'all' || i.storageType === currentFilter;
            const sMatch = i.name.toLowerCase().includes(searchQuery.toLowerCase());
            return fMatch && sMatch;
        });
        if (!filtered.length) {
            inventoryList.innerHTML = '<div class="empty-state">검색 결과가 없거나 냉장고가 비어있어요.</div>';
            return;
        }
        filtered.forEach(item => {
            const dDay = calculateDDay(item.expiryDate);
            const isEditing = editingId === item.id;
            const card = document.createElement('article');
            card.className = `food-card ${dDay <= 3 ? 'expiring-soon' : ''}`;

            if (isEditing) {
                card.innerHTML = `
                    <div class="inline-edit-form">
                        <div class="inline-edit-row">
                            <input type="text" id="edit-name-${item.id}" value="${item.name}" placeholder="식품명">
                            <select id="edit-stor-${item.id}" style="min-width:60px">
                                ${['냉장','냉동','실온'].map(s => `<option ${s===item.storageType?'selected':''}>${s}</option>`).join('')}
                            </select>
                        </div>
                        <div class="inline-edit-row">
                            <select id="edit-cat-${item.id}">
                                ${['채소/과일','육류/해산물','유제품','가공식품','음료','기타'].map(c => `<option ${c===item.category?'selected':''}>${c}</option>`).join('')}
                            </select>
                            <input type="date" id="edit-date-${item.id}" value="${item.expiryDate}">
                        </div>
                        <div class="card-actions">
                            <button class="action-btn save-btn" onclick="saveEdit('${item.id}')">저장</button>
                            <button class="action-btn cancel-btn" onclick="cancelEdit()">취소</button>
                        </div>
                    </div>`;
            } else {
                const dDayText = dDay < 0 ? `D+${Math.abs(dDay)}` : dDay === 0 ? '오늘' : `D-${dDay}`;
                const urgent = dDay <= 3;
                card.innerHTML = `
                    <div class="dday-badge ${urgent ? 'urgent' : ''}">${dDayText}</div>
                    <div class="food-main">
                        <div class="food-name">${item.name}</div>
                        <div class="food-sub">${item.category} · ${item.storageType} · ${item.expiryDate}</div>
                    </div>
                    <div class="food-right">
                        <div class="quantity-control">
                            <button class="q-btn" onclick="updateQty('${item.id}',-1)">−</button>
                            <span class="qty-num">${item.quantity}</span>
                            <button class="q-btn" onclick="updateQty('${item.id}',1)">+</button>
                        </div>
                        <div class="food-actions">
                            <button class="action-btn edit-btn" onclick="startEdit('${item.id}')">수정</button>
                            <button class="action-btn delete-btn" onclick="deleteItem('${item.id}')">삭제</button>
                        </div>
                    </div>`;
            }
            inventoryList.appendChild(card);
        });
    }

    // ============================================================
    // CRUD (Realtime Database)
    // ============================================================
    document.getElementById('add-food-form').onsubmit = async (e) => {
        e.preventDefault();
        const newItem = {
            name: document.getElementById('food-name').value,
            category: document.getElementById('food-category').value,
            quantity: parseInt(document.getElementById('food-quantity').value),
            storageType: document.getElementById('storage-type').value,
            expiryDate: document.getElementById('expiry-date').value,
            createdAt: Date.now()
        };
        await inventoryRef.push(newItem);
        document.getElementById('add-food-form').reset();
        document.getElementById('expiry-date').valueAsDate = new Date();
        regModal.style.display = 'none';
    };

    function startEdit(id) { editingId = id; renderInventory(); }
    function cancelEdit() { editingId = null; renderInventory(); }

    async function saveEdit(id) {
        await inventoryRef.child(id).update({
            name: document.getElementById(`edit-name-${id}`).value,
            category: document.getElementById(`edit-cat-${id}`).value,
            storageType: document.getElementById(`edit-stor-${id}`).value,
            expiryDate: document.getElementById(`edit-date-${id}`).value
        });
        editingId = null;
    }

    async function deleteItem(id) {
        if (confirm('냉장고에서 뺄까요?')) {
            await inventoryRef.child(id).remove();
        }
    }

    async function updateQty(id, chg) {
        const item = inventory.find(x => x.id === id);
        const newQty = item.quantity + chg;
        if (newQty <= 0) deleteItem(id);
        else await inventoryRef.child(id).update({ quantity: newQty });
    }

    // ============================================================
    // UI 이벤트
    // ============================================================
    document.getElementById('open-reg-modal').onclick = () => { regModal.style.display = 'flex'; };
    document.getElementById('close-reg-modal').onclick = () => { regModal.style.display = 'none'; };
    document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value; renderInventory(); };
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelector('.tab-btn.active').classList.remove('active');
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderInventory();
        };
    });

    // ============================================================
    // 바코드 → 제품 정보 조회 (공공데이터포털 식품안전나라)
    // ============================================================
    const API_KEY = '252af7493ac47eea056e5442f2e5e929f5da162acdd0cf04d9bd7beef5ac65a1';

    function mapCategory(raw) {
        if (!raw) return '기타';
        if (raw.includes('채소') || raw.includes('과일') || raw.includes('농산')) return '채소/과일';
        if (raw.includes('육') || raw.includes('고기') || raw.includes('수산') || raw.includes('해산') || raw.includes('어패')) return '육류/해산물';
        if (raw.includes('유제품') || raw.includes('우유') || raw.includes('치즈') || raw.includes('유가공')) return '유제품';
        if (raw.includes('음료') || raw.includes('주류') || raw.includes('차') || raw.includes('커피')) return '음료';
        if (raw.includes('가공') || raw.includes('즉석') || raw.includes('면') || raw.includes('과자') || raw.includes('빵')) return '가공식품';
        return '기타';
    }

    async function fetchProductByBarcode(barcode) {
        const url = `https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo01/getFoodNtrCpntDbInq01?serviceKey=${API_KEY}&pageNo=1&numOfRows=1&type=json&BARCD_NO=${barcode}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            const items = data?.body?.items;
            if (items && items.length > 0) {
                const item = items[0];
                return {
                    name: item.PRDLST_NM || '',
                    category: mapCategory(item.PRDLST_DCNM || item.BSSH_NM || '')
                };
            }
        } catch (e) {
            console.error('API 오류:', e);
        }
        return null;
    }

    // 바코드 스캐너
    let html5QrCode;
    document.getElementById('scan-btn').onclick = () => {
        document.getElementById('scanner-modal').style.display = 'flex';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async (barcode) => {
            closeScanner();
            const nameInput = document.getElementById('food-name');
            nameInput.value = '조회 중...';
            nameInput.disabled = true;

            const product = await fetchProductByBarcode(barcode);

            nameInput.disabled = false;
            regModal.style.display = 'flex';

            if (product && product.name) {
                nameInput.value = product.name;
                document.getElementById('food-category').value = product.category;
            } else {
                nameInput.value = '';
                nameInput.placeholder = '제품을 찾지 못했어요. 직접 입력해주세요.';
                alert(`바코드(${barcode})\n제품 정보를 찾지 못했어요. 직접 입력해주세요!`);
            }
        }).catch(() => { alert('카메라 권한을 허용해주세요.'); closeScanner(); });
    };

    function closeScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => { html5QrCode.clear(); document.getElementById('scanner-modal').style.display = 'none'; });
        } else {
            document.getElementById('scanner-modal').style.display = 'none';
        }
    }
    document.getElementById('close-scanner').onclick = closeScanner;
</script>
